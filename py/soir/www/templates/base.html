<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>soir - {% block title %}{{ title | lower }}{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/pygments.css') }}">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <a href="#main" class="skip-link">Skip to content</a>

    <nav class="navigation" aria-label="Main navigation">
        <div class="nav-container">
            <a href="{{ url_for('home') }}" class="nav-link">home</a>
            <a href="{{ url_for('quickstart') }}" class="nav-link">quickstart</a>
            <a href="{{ url_for('examples') }}" class="nav-link">examples</a>
            <a href="{{ url_for('reference') }}" class="nav-link">reference</a>
            <a href="{{ url_for('reference') }}#search" class="nav-link nav-search" aria-label="Search reference" title="Search reference">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
            </a>
        </div>
    </nav>

    <main class="content" id="main">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <div class="footer-container">
            <p>soir — <i>live-coding environment</i><br />by <a href="https://mxs.sbrk.org" rel="noopener">mxs</a></p>
        </div>
    </footer>
</body>
</html>
