# Soir documentation website - production deployment.
#
#   docker compose -f docker/docker-compose.yml up -d --build
#   docker compose -f docker/docker-compose.yml down
#
# Host port 10011 -> container 5000.
services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "10011:5000"
    environment:
      - SOIR_HOME=/data
    volumes:
      - soir-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "/opt/venv/bin/python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5000/', timeout=5).status==200 else 1)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  soir-data:
